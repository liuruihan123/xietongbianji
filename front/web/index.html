<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="协同编辑系统" />
    <meta name="keywords" content="协同编辑系统" />
    <meta name="author" content="协同编辑系统" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Fonts - Local -->
    <link rel="stylesheet" href="/src/assets/fonts/inter/inter.css">

    <!-- Font Awesome - Local -->
    <link rel="stylesheet" href="/src/assets/fonts/font-awesome/css/font-awesome.min.css">

    <!-- Theme -->
    <script>
      // 防止闪烁，提前设置主题
      (function() {
        const theme = localStorage.getItem('theme') || 'light'
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- Global polyfill for sockjs-client -->
    <script>
      window.global = window;
    </script>

    <!-- 运行时配置 - 必须在应用启动前加载 -->
    <script src="/config.js"></script>

    <title>DocLogic</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
